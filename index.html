<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gun Jumper - Recoil Platformer</title>
    <meta name="description" content="A recoil-based platformer featuring a Goblin Tinkerer with steampunk weaponry">
    <style>
        * {
            margin: 0;
            padding: 0;
